[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-finetune"
version = "0.1.0"
description = "Prepare transcribed audio and fine-tune OpenAI Whisper with Hugging Face transformers"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "datasets==5.2.0",
    "numpy==2.5.4",
    "soundfile==0.14.0",
    "torch==2.15.0",
    "transformers==5.22.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[project.scripts]
whisper-finetune = "whisper_finetune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
