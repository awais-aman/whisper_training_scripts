# Example config for `whisper-finetune train --config train.example.toml`.
# Keys mirror the CLI flags; env vars and flags override them.
model_name = "openai/whisper-small"
manifest = "data/processed/manifest.jsonl"
output_dir = "models/whisper-small"
task = "transcribe"
# language = "urdu"

learning_rate = 1e-5
warmup_steps = 50
max_steps = 500
batch_size = 8
gradient_accumulation_steps = 2
save_steps = 250
eval_fraction = 0.05
